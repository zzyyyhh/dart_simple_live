name: build-windows
# 手动触发；推到 master/main 也会自动编一次
on:
  workflow_dispatch:
  push:
    branches: [master, main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # 先打补丁：改 3 个 Dart 文件，任何一处对不上会直接失败并打印原因
      - name: Apply douyu fix
        run: |
          python --version
          python apply_fix.py
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # 仓库要求 Flutter 3.38（自带 Dart 3.10）；如该版本不存在，改成 '3.38.x'
          flutter-version: '3.38.0'
          channel: stable
          cache: true
      - name: Pub get
        working-directory: simple_live_app
        run: flutter pub get
      - name: Build Windows release
        working-directory: simple_live_app
        run: flutter build windows --release
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: simple_live_app-windows
          if-no-files-found: error
          path: simple_live_app/build/windows/x64/runner/Release/
